name: render-reels
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency:
  group: render
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts playwright imageio-ffmpeg
      - run: python -m playwright install --with-deps chromium
      - run: python pipeline/gh_render.py
        env:
          PIPELINE_CONFIG: ${{ secrets.PIPELINE_CONFIG }}
